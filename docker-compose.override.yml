services:
  app:
    image: devops-engineer-from-scratch-project-74:development
    pull_policy: build
    build:
      dockerfile: Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
      pnpm_config_store_dir: /tmp/pnpm-store
      pnpm_config_package_import_method: copy
    volumes:
      - ./app:/app
    ports:
      - "8080:8080"
    command: make dev

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
