services:
  app:
    image: node:26
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
      pnpm_config_store_dir: /tmp/pnpm-store
      pnpm_config_package_import_method: copy
    volumes:
      - ./app:/app
    ports:
      - "8080:8080"
    command: ["npm", "exec", "--yes", "--package=pnpm@12.6.0", "--", "make", "dev"]
